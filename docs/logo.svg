<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t">
  <title id="t">Конструктор доступных интерфейсов</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD46A"/>
      <stop offset="0.55" stop-color="#14A048"/>
      <stop offset="1" stop-color="#0B7A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04452B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- iOS-подобная «скруглённая» плашка -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- Модули конструктора: три готовых виджета и один, который добавляет пользователь -->
  <g filter="url(#shadow)">
    <rect x="232" y="232" width="252" height="252" rx="72" fill="#FFFFFF"/>
    <rect x="540" y="232" width="252" height="252" rx="72" fill="#FFFFFF" fill-opacity="0.92"/>
    <rect x="232" y="540" width="252" height="252" rx="72" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>
  <rect x="558" y="558" width="216" height="216" rx="58" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-opacity="0.95"/>
  <path d="M666 616 V716 M616 666 H716" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>

  <!-- Крупная «точка-кнопка» в первом виджете: намёк на большие цели нажатия -->
  <circle cx="358" cy="358" r="58" fill="#14A048"/>
</svg>
